name: Stage 6 CI and diagnostic acceptance

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  static-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEPLOYMENT_TIER: staging
      BUILD_ID: ${{ github.sha }}
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_ALLOW_INDEXING: 0
      NEXT_PUBLIC_3D_ASSET_SET: r6
      NEXT_PUBLIC_BRAND_ASSET_SET: stage4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Require reviewed lockfile
        run: node scripts/check-lockfile.mjs
      - run: npm ci --no-audit --no-fund
      - run: npm run validate:stage1
      - run: npm run validate:stage2
      - run: npm run validate:stage3
      - run: npm run validate:stage4
      - run: npm run validate:stage5
      - run: npm run validate:stage6
      - run: npm run qa:content
      - run: npm run typecheck
      - run: npm run build
      - name: Save build evidence marker
        run: |
          mkdir -p artifacts/build
          printf 'commit=%s\nnode=%s\ncompleted=%s\n' "$GITHUB_SHA" "$(node --version)" "$(date -u +%FT%TZ)" > artifacts/build/next-build.txt
      - uses: actions/upload-artifact@v4
        with:
          name: stage6-build-evidence
          path: artifacts/build/next-build.txt

  browser-acceptance:
    needs: static-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEPLOYMENT_TIER: staging
      BUILD_ID: ${{ github.sha }}
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_ALLOW_INDEXING: 0
      NEXT_PUBLIC_3D_ASSET_SET: r6
      NEXT_PUBLIC_BRAND_ASSET_SET: stage4
      ENABLE_ACCEPTANCE_QA: 1
      CONTACT_WEBHOOK_URL: http://127.0.0.1:8787/contact
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --no-audit --no-fund
      - run: pip install -r requirements-acceptance.txt
      - run: playwright install --with-deps chromium firefox webkit
      - run: npm run build
      - name: Start app and sink webhook
        run: |
          node -e "require('http').createServer((req,res)=>{let b='';req.on('data',d=>b+=d);req.on('end',()=>{res.writeHead(204);res.end()})}).listen(8787,'127.0.0.1')" > /tmp/webhook.log 2>&1 &
          npm start > /tmp/app.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:3000/api/health >/dev/null && exit 0; sleep 1; done
          cat /tmp/app.log
          exit 1
      - name: Browser acceptance (diagnostic FPS in CI)
        run: python3 scripts/acceptance_qa.py --url http://127.0.0.1:3000 --out artifacts/acceptance --no-fps-gate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage6-browser-acceptance
          path: artifacts/acceptance
