name: R6.1.2 CI and diagnostic acceptance

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  code-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEPLOYMENT_TIER: staging
      BUILD_ID: ${{ github.sha }}
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_ALLOW_INDEXING: 0
      NEXT_PUBLIC_3D_ASSET_SET: r6
      NEXT_PUBLIC_BRAND_ASSET_SET: stage4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Require reviewed lockfile dependency graph
        run: node scripts/check-lockfile.mjs
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - name: Run source/runtime regression contracts
        run: npm test
      - name: Save build evidence marker
        run: |
          mkdir -p artifacts/build
          printf 'commit=%s\nnode=%s\ncompleted=%s\n' "$GITHUB_SHA" "$(node --version)" "$(date -u +%FT%TZ)" > artifacts/build/next-build.txt
      - uses: actions/upload-artifact@v4
        with:
          name: r612-code-build-evidence
          path: artifacts/build/next-build.txt

  release-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_3D_ASSET_SET: r6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --no-audit --no-fund
      - name: Install deterministic CPU-only asset validation dependencies
        run: pip install trimesh==4.11.1 numpy==2.3.5 Pillow==12.3.0
      - name: Require authoritative R6.1 Manufacturing visual master
        run: npm run validate:r61:source
      - name: Build normalized R6.1 assets only from authoritative sources
        run: npm run assets:r6
      - name: Validate R6 corporate asset contract
        run: npm run validate:corporate:r6
      - name: Prove genuine LOD2 to proxy provenance
        run: npm run validate:r6:proxy
      - name: Re-prove deterministic CPU fallback generation
        run: npm run prove:r6:cpu-fallback
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r612-release-asset-evidence
          path: |
            artifacts/r6-cpu-fallback-proof.json
            public/models/r6/manifest.json
            public/models/r6/proxy-reduction.json
          if-no-files-found: ignore

  browser-acceptance:
    needs: [code-build, release-assets]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEPLOYMENT_TIER: staging
      BUILD_ID: ${{ github.sha }}
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_ALLOW_INDEXING: 0
      NEXT_PUBLIC_3D_ASSET_SET: r6
      NEXT_PUBLIC_BRAND_ASSET_SET: stage4
      ENABLE_ACCEPTANCE_QA: 1
      CONTACT_WEBHOOK_URL: http://127.0.0.1:8787/contact
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --no-audit --no-fund
      - run: pip install -r requirements-acceptance.txt
      - run: playwright install --with-deps chromium
      - run: npm run build
      - name: Start app and sink webhook
        run: |
          node -e "require('http').createServer((req,res)=>{req.resume();req.on('end',()=>{res.writeHead(204);res.end()})}).listen(8787,'127.0.0.1')" > /tmp/webhook.log 2>&1 &
          npm start > /tmp/app.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:3000/api/health >/dev/null && exit 0; sleep 1; done
          cat /tmp/app.log
          exit 1
      - name: Six-chapter browser acceptance
        run: python3 scripts/acceptance_qa.py --url http://127.0.0.1:3000 --out artifacts/acceptance --no-fps-gate
      - name: Runtime WebGL failure fallback proof
        run: python3 scripts/acceptance_qa.py --url http://127.0.0.1:3000 --webgl-fallback-proof-only --out artifacts/webgl-fallback
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r612-browser-acceptance
          path: |
            artifacts/acceptance
            artifacts/webgl-fallback
