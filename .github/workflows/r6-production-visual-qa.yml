name: R6 Production Visual QA

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Deploy R6 Hero Fidelity to Vercel"]
    types: [completed]
  workflow_dispatch:
    inputs:
      url:
        description: "Optional production/preview URL to inspect"
        required: false
        type: string

permissions:
  actions: read
  contents: read

jobs:
  capture:
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install visual QA driver
        run: python -m pip install --disable-pip-version-check selenium==4.35.0 Pillow==12.3.0

      - name: Resolve deployed URL
        id: deploy
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL_URL: ${{ inputs.url }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          EXPECTED_SHA=""
          if [ -n "${MANUAL_URL:-}" ]; then
            URL="$MANUAL_URL"
          elif [ "$EVENT_NAME" = "push" ]; then
            URL="https://convalt-energy-r612-prod.onrender.com"
            EXPECTED_SHA="$GITHUB_SHA"
          else
            test -n "${SOURCE_RUN_ID:-}" || { echo "::error::No source workflow run id"; exit 2; }
            mkdir -p /tmp/r6-deploy-log
            ART_ID=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/artifacts" \
              --jq '.artifacts[] | select(.name=="vercel-r6-hero-fidelity-deploy-log") | .id' | head -n 1)
            test -n "$ART_ID" || { echo "::error::Deployment-log artifact not found"; exit 3; }
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ART_ID}/zip" > /tmp/r6-deploy.zip
            unzip -q /tmp/r6-deploy.zip -d /tmp/r6-deploy-log
            URL=$(grep -Eho 'https://[A-Za-z0-9._-]+\.vercel\.app' /tmp/r6-deploy-log/* | tail -n 1 || true)
          fi
          test -n "${URL:-}" || { echo "::error::Unable to resolve deployment URL"; exit 4; }
          URL="${URL%/}"
          echo "Resolved production URL: $URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "expected_sha=$EXPECTED_SHA" >> "$GITHUB_OUTPUT"

      - name: Wait for exact production build and R6 assets
        env:
          URL: ${{ steps.deploy.outputs.url }}
          EXPECTED_SHA: ${{ steps.deploy.outputs.expected_sha }}
        run: |
          set -euo pipefail
          for i in $(seq 1 72); do
            CODE=$(curl -L -sS -o /tmp/r6-health.json -w '%{http_code}' "$URL/api/health" || true)
            if [ "$CODE" = "200" ]; then
              COMMIT=$(jq -r '.gitCommit // "unknown"' /tmp/r6-health.json 2>/dev/null || echo unknown)
              ASSET_SET=$(jq -r '.assetSet // "unknown"' /tmp/r6-health.json 2>/dev/null || echo unknown)
              ASSETS=$(jq -r '.r6RuntimeAssetsPresent // false' /tmp/r6-health.json 2>/dev/null || echo false)
              if [ "$ASSET_SET" = "r6" ] && [ "$ASSETS" = "true" ] && { [ -z "$EXPECTED_SHA" ] || [ "$COMMIT" = "$EXPECTED_SHA" ]; }; then
                echo "Exact deployment is healthy: commit=$COMMIT assetSet=$ASSET_SET r6Assets=$ASSETS"
                exit 0
              fi
              echo "Attempt $i: health=200 commit=$COMMIT assetSet=$ASSET_SET r6Assets=$ASSETS; waiting for target build..."
            else
              echo "Attempt $i: health HTTP ${CODE:-none}; retrying..."
            fi
            sleep 10
          done
          echo "::error::Target production build/R6 assets did not become ready"
          cat /tmp/r6-health.json || true
          exit 5

      - name: Capture and validate six production hero chapters
        env:
          BASE_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          mkdir -p visual-qa/r6
          python - <<'PY'
          import json
          import os
          import time
          from pathlib import Path
          from urllib.parse import urlsplit, urlunsplit, parse_qsl, urlencode

          from PIL import Image, ImageStat
          from selenium import webdriver
          from selenium.common.exceptions import TimeoutException
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait

          HEROES = [
              'integrated-campus', 'manufacturing-line', 'substation-bess',
              'data-center-cooling', 'recycling-intake', 'connected-campus',
          ]
          out = Path('visual-qa/r6')
          base = os.environ['BASE_URL'].rstrip('/')
          parts = urlsplit(base)
          query = dict(parse_qsl(parts.query))
          query['quality'] = 'high'
          url = urlunsplit((parts.scheme, parts.netloc, parts.path or '/', urlencode(query), parts.fragment))

          options = Options()
          options.add_argument('--headless=new')
          options.add_argument('--window-size=1600,900')
          options.add_argument('--force-device-scale-factor=1')
          options.add_argument('--enable-webgl')
          options.add_argument('--ignore-gpu-blocklist')
          options.add_argument('--enable-unsafe-swiftshader')
          options.add_argument('--no-sandbox')
          options.add_argument('--disable-dev-shm-usage')
          options.set_capability('goog:loggingPrefs', {'browser': 'ALL'})

          driver = webdriver.Chrome(options=options)
          driver.set_window_size(1600, 900)
          manifest = {'url': url, 'chapters': [], 'browserLogSevere': [], 'reducedMotionHeroVisible': False}
          try:
              driver.get(url)
              wait = WebDriverWait(driver, 90)
              wait.until(lambda d: len(d.find_elements(By.CSS_SELECTOR, '.story-progress .progress-dot')) == 6)
              wait.until(lambda d: len(d.find_elements(By.CSS_SELECTOR, '.experience-canvas canvas')) == 1)
              wait.until(lambda d: bool(d.execute_script('return window.__CONVALT_ACTIVE_HERO__?.ready === true')))
              wait.until(lambda d: len(d.find_elements(By.CSS_SELECTOR, '[data-r6-loading-cover="true"]')) == 0)
              if driver.find_elements(By.CSS_SELECTOR, '[data-r6-static-fallback="true"]'):
                  raise RuntimeError('Forced high-quality run unexpectedly entered static fallback')

              for index, expected_hero in enumerate(HEROES):
                  dots = driver.find_elements(By.CSS_SELECTOR, '.story-progress .progress-dot')
                  if len(dots) != 6:
                      raise RuntimeError(f'Expected 6 progress dots, found {len(dots)}')
                  driver.execute_script('arguments[0].click()', dots[index])
                  wait.until(lambda d, i=index: d.find_elements(By.CSS_SELECTOR, '.story-progress .progress-dot')[i].get_attribute('data-active') == 'true')
                  wait.until(lambda d, hero=expected_hero: d.execute_script('return window.__CONVALT_ACTIVE_HERO__?.ready === true && window.__CONVALT_ACTIVE_HERO__?.hero === arguments[0]', hero))
                  time.sleep(2.2 if index else 0.8)

                  if driver.find_elements(By.CSS_SELECTOR, '[data-r6-static-fallback="true"]'):
                      raise RuntimeError(f'Chapter {index+1} unexpectedly entered static fallback')
                  hero_state = driver.execute_script('return window.__CONVALT_ACTIVE_HERO__')
                  active = driver.find_element(By.CSS_SELECTOR, '.story-chapter[data-active="true"]')
                  title_el = active.find_element(By.CSS_SELECTOR, 'h1, h2')
                  title = title_el.text.strip()
                  path = out / f'chapter-{index + 1:02d}.png'
                  driver.save_screenshot(str(path))
                  with Image.open(path) as image:
                      if image.size != (1600, 900):
                          raise RuntimeError(f'{path}: expected 1600x900, got {image.size}')
                      # Guard against the exact production failure: copy was visible
                      # while the entire hero side of the stage was nearly uniform.
                      right = image.convert('L').crop((620, 90, 1540, 820))
                      stddev = ImageStat.Stat(right).stddev[0]
                      if stddev < 6.0:
                          raise RuntimeError(f'{path}: hero-side image variance too low ({stddev:.2f})')
                  copy_rect = driver.execute_script('return arguments[0].querySelector(".story-copy").getBoundingClientRect().toJSON()', active)
                  viewport_ok = copy_rect['left'] >= 0 and copy_rect['top'] >= 0 and copy_rect['right'] <= 1600 and copy_rect['bottom'] <= 900
                  if not viewport_ok:
                      raise RuntimeError(f'Chapter {index+1} copy is clipped outside viewport: {copy_rect}')
                  manifest['chapters'].append({
                      'index': index + 1,
                      'title': title,
                      'hero': hero_state,
                      'file': path.name,
                      'heroSideStddev': round(stddev, 3),
                      'copyRect': copy_rect,
                      'copyInsideViewport': viewport_ok,
                  })

              # Regression proof for the user-facing defect: reduced motion keeps
              # actual WebGL geometry and only freezes movement.
              driver.execute_script("localStorage.setItem('convalt-motion','reduced')")
              driver.refresh()
              wait.until(lambda d: len(d.find_elements(By.CSS_SELECTOR, '.experience-canvas canvas')) == 1)
              wait.until(lambda d: bool(d.execute_script('return window.__CONVALT_ACTIVE_HERO__?.ready === true')))
              if driver.find_elements(By.CSS_SELECTOR, '[data-r6-static-fallback="true"]'):
                  raise RuntimeError('Reduced-motion preference removed the real WebGL hero')
              manifest['reducedMotionHeroVisible'] = True

              severe = [entry for entry in driver.get_log('browser') if entry.get('level') == 'SEVERE']
              manifest['browserLogSevere'] = severe
              fatal_terms = ('webgl', 'ktx', 'texture', 'glb', 'shader', 'context lost')
              fatal = [entry for entry in severe if any(term in entry.get('message', '').lower() for term in fatal_terms)]
              if fatal:
                  raise RuntimeError('Severe browser errors related to the R6 renderer/assets: ' + json.dumps(fatal[:8]))
          except TimeoutException as exc:
              raise RuntimeError('Timed out waiting for visible R6 production hero geometry') from exc
          finally:
              (out / 'manifest.json').write_text(json.dumps(manifest, indent=2), encoding='utf-8')
              driver.quit()
          PY

      - name: Upload six-frame visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: r6-production-visual-qa
          path: visual-qa/r6
          retention-days: 30
          if-no-files-found: error
