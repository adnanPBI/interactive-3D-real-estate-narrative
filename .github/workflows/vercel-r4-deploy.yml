name: Deploy R4 to Vercel

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/vercel-r4-deploy.yml"
      - "scripts/validate-corporate-r4.mjs"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install exact dependencies
        run: npm ci
      - name: TypeScript gate
        run: npm run typecheck
      - name: R4 runtime visual asset gate
        env:
          R4_RUNTIME_ONLY: "1"
        run: npm run validate:corporate:r4
      - name: Deploy production to Vercel
        env:
          VERCEL_TOKEN_1: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TOKEN_2: ${{ secrets.VERCEL_ACCESS_TOKEN }}
          VERCEL_TOKEN_3: ${{ secrets.VERCEL_API_TOKEN }}
          VERCEL_TOKEN_4: ${{ secrets.TURBO_TOKEN }}
        run: |
          set -euo pipefail
          TOKEN="${VERCEL_TOKEN_1:-}"
          SOURCE_NAME="VERCEL_TOKEN"
          if [ -z "$TOKEN" ] && [ -n "${VERCEL_TOKEN_2:-}" ]; then TOKEN="$VERCEL_TOKEN_2"; SOURCE_NAME="VERCEL_ACCESS_TOKEN"; fi
          if [ -z "$TOKEN" ] && [ -n "${VERCEL_TOKEN_3:-}" ]; then TOKEN="$VERCEL_TOKEN_3"; SOURCE_NAME="VERCEL_API_TOKEN"; fi
          if [ -z "$TOKEN" ] && [ -n "${VERCEL_TOKEN_4:-}" ]; then TOKEN="$VERCEL_TOKEN_4"; SOURCE_NAME="TURBO_TOKEN"; fi
          if [ -z "$TOKEN" ]; then
            echo "::error::No usable Vercel CLI token secret is configured. Checked VERCEL_TOKEN, VERCEL_ACCESS_TOKEN, VERCEL_API_TOKEN and TURBO_TOKEN."
            exit 2
          fi
          echo "Using configured Vercel credential from $SOURCE_NAME (value masked)."
          npx vercel@latest whoami --token "$TOKEN"
          npx vercel@latest --prod --yes --token "$TOKEN"
