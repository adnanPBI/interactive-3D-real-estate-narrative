name: Deploy R5 Hybrid Cinematic to Vercel

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/vercel-r4-deploy.yml"
      - "app/**"
      - "components/**"
      - "content/**"
      - "experience/**"
      - "lib/**"
      - "assets-source/r4/**"
      - "scripts/**"
      - "requirements-assets.txt"
      - "next.config.ts"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply one-time R5 source upgrade
        run: |
          set -euo pipefail
          if compgen -G "scripts/r5-source.patch.gz.b64.part-*" > /dev/null; then
            cat scripts/r5-source.patch.gz.b64.part-* | base64 --decode | gzip --decompress > /tmp/r5-source.patch
            git apply --check --exclude=README.md /tmp/r5-source.patch
            git apply --exclude=README.md /tmp/r5-source.patch
            rm scripts/r5-source.patch.gz.b64.part-*
          else
            echo "R5 source upgrade is already materialized on main."
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-assets.txt
      - name: Install exact Node dependencies
        run: npm ci
      - name: Install asset-authoring dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-assets.txt
      - name: Generate deterministic R5 high and medium hero assets
        run: npm run assets:r5
      - name: TypeScript gate
        run: npm run typecheck
      - name: R5 hybrid visual-fidelity gate
        run: npm run validate:corporate:r5
      - name: Production build gate
        env:
          VERCEL: "1"
        run: npm run build
      - name: Persist R5 source and generated runtime assets to main
        run: |
          set -euo pipefail
          rm -rf scripts/__pycache__
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            package.json package-lock.json \
            components/experience/AssetPreloader.tsx \
            components/experience/CinematicCameraRig.tsx \
            components/experience/ExperienceCanvas.tsx \
            components/experience/InstancedSolarField.tsx \
            components/experience/PerformanceGovernor.tsx \
            components/experience/SceneAsset.tsx \
            components/experience/StoryWorld.tsx \
            experience/config/scenes.ts experience/config/storyMotion.ts \
            docs/corporate/R5_HYBRID_CINEMATIC_UPGRADE.md \
            scripts/generate-r5-hybrid-assets.py scripts/validate-corporate-r5.mjs \
            public/models/r5 public/fallback/r5 assets-source/r4/textures
          git add -u scripts
          if git diff --cached --quiet; then
            echo "R5 source and assets already match main."
          else
            git commit -m "feat(r5): refresh deterministic hybrid assets [skip ci]"
            git push origin HEAD:main
          fi
      - name: Verify Vercel token
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}" || { echo "::error::VERCEL_TOKEN is not configured"; exit 2; }
          STATUS=$(curl -sS -o /tmp/vercel-user.json -w '%{http_code}' -H "Authorization: Bearer ${VERCEL_TOKEN}" https://api.vercel.com/v2/user)
          echo "Vercel /v2/user HTTP status: ${STATUS}"
          test "$STATUS" = "200"
      - name: Link and deploy production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          npx vercel@latest link --yes \
            --project interactive-3d-real-estate-narrative-r4 \
            --scope adnans-projects-1993fd6c \
            --token "$VERCEL_TOKEN"
          npx vercel@latest deploy --prod --yes \
            --scope adnans-projects-1993fd6c \
            --token "$VERCEL_TOKEN" 2>&1 | tee vercel-deploy.log
      - name: Upload deployment log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vercel-r5-hybrid-deploy-log
          path: vercel-deploy.log
          if-no-files-found: ignore
