name: Deploy R6 Hero Fidelity to Vercel

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/vercel-r4-deploy.yml"
      - ".gitignore"
      - "app/**"
      - "components/**"
      - "content/**"
      - "experience/**"
      - "lib/**"
      - "assets-source/r6/**"
      - "scripts/**"
      - "tools/r6-*.py"
      - "tests/r6-*.test.mjs"
      - "public/fallback/r6/**"
      - "public/textures/r6/**"
      - "requirements-assets.txt"
      - "next.config.ts"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply one-time R6 source upgrade
        run: |
          set -euo pipefail
          if compgen -G "scripts/r6-source.patch.gz.b64.part-*" > /dev/null; then
            cat scripts/r6-source.patch.gz.b64.part-* | base64 --decode | gzip --decompress > /tmp/r6-source.patch
            git apply --check --exclude=.github/workflows/vercel-r4-deploy.yml /tmp/r6-source.patch
            git apply --exclude=.github/workflows/vercel-r4-deploy.yml /tmp/r6-source.patch
            rm scripts/r6-source.patch.gz.b64.part-*
          else
            echo "R6 source upgrade is already materialized on main."
          fi
          # Replace the VTK/OpenGL fallback renderer with the deterministic
          # Pillow renderer so `npm run assets:r6` remains headless-CI safe.
          cp tools/r6-headless-fallbacks.py scripts/render-r6-fallbacks.py

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-assets.txt

      - name: Install exact application dependencies
        run: npm ci

      - name: Install asset-authoring dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-assets.txt

      - name: Install temporary KTX2 authoring tools
        run: |
          npm install --no-save --package-lock=false --ignore-scripts \
            @gltf-transform/core@4.2.1 \
            @gltf-transform/extensions@4.2.1 \
            ktx2-encoder@0.6.0 \
            sharp@0.34.5

      - name: Reconstruct distinct LOD2 and proxy authoring inputs
        run: |
          set -euo pipefail
          mkdir -p public/models/stage3 public/models/stage2
          for name in hero-campus manufacturing power-generation data-centers recycling closing-platform; do
            # LOD2 source: newer R5 medium asset.
            cp "public/models/r5/medium/${name}.glb" "public/models/stage3/${name}.glb"
            # Proxy source: materially lighter R4 asset, never an alias/copy of LOD2.
            cp "public/models/r4/${name}.glb" "public/models/stage2/${name}.glb"
          done

      - name: Generate R6 four-LOD hero pack, headless fallbacks and KTX2 textures
        run: npm run assets:r6

      - name: Genuine proxy reduction gate
        run: python3 tools/validate-r6-proxy-lods.py

      - name: TypeScript gate
        run: npm run typecheck

      - name: R6 corporate fidelity gate
        run: npm run validate:corporate:r6

      - name: R6 material and SMAA gate
        run: npm run validate:r6:materials

      - name: R6 active-scene budget gate
        run: npm run validate:r6:budgets

      - name: R6 focused tests
        run: npm run qa:r6

      - name: Production build gate
        env:
          VERCEL: "1"
        run: npm run build

      - name: Persist R6 source and generated runtime assets to main
        run: |
          set -euo pipefail
          rm -rf scripts/__pycache__ assets-source/r6/authoring/__pycache__ .r6-raw public/models/stage3 public/models/stage2
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .gitignore package.json package-lock.json requirements-assets.txt \
            components/experience \
            experience/config experience/systems \
            lib/experienceStore.ts types/qa.d.ts app/globals.css \
            assets-source/r6 \
            scripts/generate-r6-assets.py scripts/encode-r6-ktx2.mjs \
            scripts/validate-corporate-r6.mjs scripts/validate-r6-materials.mjs scripts/validate-r6-budgets.mjs \
            scripts/render-r6-fallbacks.py \
            tools/r6-headless-fallbacks.py tools/validate-r6-proxy-lods.py \
            tests/r6-assets.test.mjs tests/r6-runtime.test.mjs tests/r6-budgets.test.mjs \
            public/models/r6 public/textures/r6 public/fallback/r6 \
            docs/corporate/R6_HERO_FIDELITY_IMPLEMENTATION.md docs/R6_CAVEATS.md docs/R6_CLAUDE_CHERRYPICK.md R6_FINAL_HANDOFF.md \
            .github/workflows/vercel-r4-deploy.yml
          git add -u scripts
          if git diff --cached --quiet; then
            echo "R6 source and assets already match main."
          else
            git commit -m "feat(r6): hero fidelity, true proxies, KTX2 and SMAA [skip ci]"
            git push origin HEAD:main
          fi

      - name: Verify Vercel token
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}" || { echo "::error::VERCEL_TOKEN is not configured"; exit 2; }
          STATUS=$(curl -sS -o /tmp/vercel-user.json -w '%{http_code}' -H "Authorization: Bearer ${VERCEL_TOKEN}" https://api.vercel.com/v2/user)
          echo "Vercel /v2/user HTTP status: ${STATUS}"
          test "$STATUS" = "200"

      - name: Link and deploy production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          npx vercel@latest link --yes \
            --project interactive-3d-real-estate-narrative-r4 \
            --scope adnans-projects-1993fd6c \
            --token "$VERCEL_TOKEN"
          npx vercel@latest deploy --prod --yes \
            --scope adnans-projects-1993fd6c \
            --token "$VERCEL_TOKEN" 2>&1 | tee vercel-deploy.log

      - name: Upload deployment log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vercel-r6-hero-fidelity-deploy-log
          path: vercel-deploy.log
          if-no-files-found: ignore
