name: Deploy R4 to Vercel

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/vercel-r4-deploy.yml"
      - "scripts/validate-corporate-r4.mjs"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install exact dependencies
        run: npm ci
      - name: TypeScript gate
        run: npm run typecheck
      - name: R4 runtime visual asset gate
        env:
          R4_RUNTIME_ONLY: "1"
        run: npm run validate:corporate:r4
      - name: Deploy production to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "::error::GitHub repository secret VERCEL_TOKEN is not configured."
            exit 2
          fi
          case "$VERCEL_TOKEN" in
            vcp_*) ;;
            *)
              echo "::error::VERCEL_TOKEN must be a Vercel personal access token (vcp_...)."
              exit 2
              ;;
          esac
          echo "Vercel personal access token detected (value masked)."
          npx vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN" 2>&1 | tee vercel-deploy.log
      - name: Upload deployment log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vercel-r4-deploy-log
          path: vercel-deploy.log
          if-no-files-found: ignore
