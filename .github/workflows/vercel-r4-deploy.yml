name: Deploy R6.1 Manufacturing Fidelity to Vercel

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/vercel-r4-deploy.yml"
      - "app/**"
      - "components/**"
      - "experience/**"
      - "lib/**"
      - "public/models/r6/**"
      - "public/textures/r6/**"
      - "public/fallback/r6/**"
      - "scripts/generate-r6-assets.py"
      - "scripts/build-r61-assets.py"
      - "scripts/author-r61-manufacturing-source.py"
      - "scripts/encode-r61-textures.py"
      - "scripts/install-ktx-tools.sh"
      - "scripts/validate-r61-source.py"
      - "scripts/validate-r61-textures.py"
      - "assets-source/r6/heroes/**"
      - "scripts/validate-corporate-r6.mjs"
      - "scripts/validate-r6-proxy-provenance.py"
      - "scripts/prove-r6-cpu-fallback.py"
      - "scripts/acceptance_qa.py"
      - "requirements-acceptance.txt"
      - "tests/r6-assets.test.mjs"
      - "tests/r6-runtime-contract.test.mjs"
      - "tests/r612-rendering-contract.test.mjs"
      - "package.json"
      - "package-lock.json"
      - "vercel.json"
      - ".nvmrc"
      - "tsconfig.json"
      - "deployment/**"
      - "content/**"
      - "artifacts/production/*.example.json"
      - "scripts/check-client-approval.mjs"
      - "scripts/verify-production-provenance.mjs"
      - "scripts/check-operations-ownership.mjs"
      - "scripts/cutover-preflight.mjs"
      - "scripts/production_smoke.py"
      - "scripts/verify-r612-release-integrity.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-assets.txt
            requirements-acceptance.txt
      - name: Runtime version diagnostics
        run: |
          node --version
          npm --version
          python --version
      - name: Install exact Node dependencies
        run: npm ci --no-audit --no-fund
      - name: Install asset and acceptance validation dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements-assets.txt
          python -m pip install --disable-pip-version-check -r requirements-acceptance.txt
      - name: Validate pipeline-authoritative Manufacturing visual master
        run: npm run validate:r61:source
      - name: Install pinned Khronos KTX encoder
        run: |
          TOKTX_PATH=$(scripts/install-ktx-tools.sh)
          echo "TOKTX=$TOKTX_PATH" >> "$GITHUB_ENV"
      - name: Build R6.1 assets with release Basis KTX2
        run: npm run assets:r6:release
      - name: R6.1 Basis KTX2 and mip-chain release gate
        run: npm run validate:r61:textures:release
      - name: Preserve and re-prove canonical CPU fallback renderer
        run: npm run prove:r6:cpu-fallback
      - name: R6 final-LOD2 proxy provenance and bounds gate
        run: npm run validate:r6:proxy
      - name: R6.1 structural, fidelity and budget gate
        env:
          R61_REQUIRE_BASIS: "1"
        run: npm run validate:corporate:r6
      - name: R6 focused structural/runtime-contract tests
        run: node --test tests/r6-assets.test.mjs tests/r6-runtime-contract.test.mjs tests/r612-rendering-contract.test.mjs
      - name: TypeScript gate
        run: npm run typecheck
      - name: Production build gate
        env:
          VERCEL: "1"
          NEXT_PUBLIC_3D_ASSET_SET: "r6"
        run: npm run build
      - name: Install Chromium for production-runtime acceptance
        run: python -m playwright install --with-deps chromium
      - name: Runtime WebGL fallback and six-chapter regression gates
        env:
          NEXT_PUBLIC_3D_ASSET_SET: "r6"
          R6_REFERENCE_URL: ${{ vars.R6_REFERENCE_URL }}
        run: |
          set -euo pipefail
          npm run start -- -p 3000 > /tmp/r6-next.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/api/health >/dev/null; then break; fi
            if ! kill -0 "$APP_PID" 2>/dev/null; then cat /tmp/r6-next.log; exit 5; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3000/api/health >/dev/null || { cat /tmp/r6-next.log; exit 6; }
          npm run qa:r6:fallback-runtime
          npm run qa:r6:six-chapter
          kill "$APP_PID"
          wait "$APP_PID" 2>/dev/null || true
          trap - EXIT
      - name: Upload pre-deploy R6 browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r6-predeploy-runtime-and-six-chapter-evidence
          path: |
            artifacts/r6-cpu-fallback-proof.json
            artifacts/r6-webgl-fallback
            artifacts/r6-six-chapter
          if-no-files-found: error
      - name: Verify release integrity and evidence templates
        run: node scripts/verify-r612-release-integrity.mjs
      - name: Verify deterministic geometry/source assets are committed
        run: |
          git diff --exit-code -- public/models/r6 public/fallback/r6 assets-source/r6
      - name: Require explicit Manufacturing visual approval before production promotion
        run: npm run validate:r61:source:release
      - name: Require connected approval / provenance / operations / benchmark / visual-review gates
        run: |
          npm run approval:check
          npm run validate:stage6
          npm run operations:check
          npm run release:provenance
          node scripts/verify-r612-manual-evidence.mjs
      - name: Verify Vercel token
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}" || { echo "::error::VERCEL_TOKEN is not configured"; exit 2; }
          STATUS=$(curl -sS -o /tmp/vercel-user.json -w '%{http_code}' -H "Authorization: Bearer ${VERCEL_TOKEN}" https://api.vercel.com/v2/user)
          echo "Vercel /v2/user HTTP status: ${STATUS}"
          test "$STATUS" = "200"
      - name: Normalize Vercel project runtime
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          RESPONSE=$(curl -fsS -X PATCH \
            "https://api.vercel.com/v9/projects/interactive-3d-real-estate-narrative-r4?teamId=team_GI0H1MJPmSQhzRXjQ1DMbK27" \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"nodeVersion":"22.x","autoAssignCustomDomains":true,"buildCommand":"npm run build","installCommand":"npm ci --no-audit --no-fund","framework":"nextjs"}')
          printf '%s' "$RESPONSE" > /tmp/vercel-project-update.json
          node -e 'const p=JSON.parse(require("fs").readFileSync("/tmp/vercel-project-update.json","utf8")); if(p.nodeVersion!=="22.x") throw new Error(`Vercel nodeVersion=${p.nodeVersion}`); console.log(`Vercel runtime=${p.nodeVersion}; build=${p.buildCommand}; install=${p.installCommand}`)'
      - name: Link and deploy production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          npx vercel@latest link --yes --project interactive-3d-real-estate-narrative-r4 --scope adnans-projects-1993fd6c --token "$VERCEL_TOKEN"
          npx vercel@latest pull --yes --environment=production --scope adnans-projects-1993fd6c --token "$VERCEL_TOKEN"
          npx vercel@latest build --prod --scope adnans-projects-1993fd6c --token "$VERCEL_TOKEN"
          npx vercel@latest deploy --prebuilt --prod --yes --scope adnans-projects-1993fd6c --token "$VERCEL_TOKEN" 2>&1 | tee vercel-deploy.log
          DEPLOY_URL=$(grep -Eo 'https://[^[:space:]]+\.vercel\.app' vercel-deploy.log | tail -n 1)
          test -n "$DEPLOY_URL"
          echo "DEPLOY_URL=$DEPLOY_URL" >> "$GITHUB_ENV"
      - name: Post-deployment production smoke and six-chapter regression
        env:
          ENABLE_PRODUCTION_CONTACT_SMOKE: "0"
        run: |
          test -n "${DEPLOY_URL:-}"
          python3 scripts/production_smoke.py --url "$DEPLOY_URL" --out artifacts/production-smoke
          python3 scripts/acceptance_qa.py --url "$DEPLOY_URL" --six-chapter-proof-only --out artifacts/postdeploy-six-chapter
      - name: Upload deployment log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vercel-r61-manufacturing-fidelity-deploy-log
          path: vercel-deploy.log
          if-no-files-found: ignore
