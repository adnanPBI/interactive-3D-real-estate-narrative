name: R4 Verified Cinematic Build

on:
  push:
    branches: ["release/r4-cinematic"]
  workflow_dispatch:

jobs:
  verify-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Reconstruct exact R4 source archive
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/convalt-r4
          mkdir -p /tmp/convalt-r4/src
          : > /tmp/convalt-r4/source.tar.xz

          echo 'Decoding repaired first 64 KiB span...'
          for f in .r4first/chunk-*.b64; do
            echo "  $f"
            base64 -d "$f" >> /tmp/convalt-r4/source.tar.xz
          done

          echo 'Decoding verified remaining span...'
          for f in .r4bin/chunk-02.b64 .r4bin/chunk-03.b64 .r4bin/chunk-04.b64 .r4bin/chunk-05.b64 .r4bin/chunk-06.b64 .r4bin/chunk-07.b64 .r4bin/chunk-08.b64 .r4bin/chunk-09.b64; do
            echo "  $f"
            base64 -d "$f" >> /tmp/convalt-r4/source.tar.xz
          done

          test "$(find .r4first -maxdepth 1 -name 'chunk-*.b64' | wc -l)" -eq 8
          echo "c76cde68cd39d1557a30e9d1d6c59463b00e73e0c6bab1ab8568ab1b42dd3a02  /tmp/convalt-r4/source.tar.xz" | sha256sum -c -
          tar -xJf /tmp/convalt-r4/source.tar.xz -C /tmp/convalt-r4/src
          test -f /tmp/convalt-r4/src/package.json
          test -f /tmp/convalt-r4/src/package-lock.json
          test -f /tmp/convalt-r4/src/scripts/generate-r4-assets.py
          echo 'R4_SOURCE_ARCHIVE_PASS'

      - name: npm ci
        working-directory: /tmp/convalt-r4/src
        run: npm ci

      - name: Install R4 asset generator dependencies
        working-directory: /tmp/convalt-r4/src
        run: python3 -m pip install --disable-pip-version-check -r requirements-assets.txt

      - name: Generate all six R4 cinematic GLBs
        working-directory: /tmp/convalt-r4/src
        run: npm run assets:r4

      - name: TypeScript validation
        working-directory: /tmp/convalt-r4/src
        run: npm run typecheck

      - name: R4 generated-asset validation
        working-directory: /tmp/convalt-r4/src
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const manifestPath = path.join('public','models','r4','manifest.json');
          if (!fs.existsSync(manifestPath)) throw new Error('R4 manifest missing');
          const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
          const assets = Array.isArray(manifest.assets) ? manifest.assets : [];
          if (assets.length !== 6) throw new Error(`Expected 6 R4 assets, got ${assets.length}`);
          let total = 0;
          let triangles = 0;
          for (const a of assets) {
            const rel = a.path || a.url || `/models/r4/${a.file || a.filename || ''}`;
            const name = rel.split('/').pop();
            const file = path.join('public','models','r4',name);
            if (!fs.existsSync(file)) throw new Error(`Missing GLB: ${file}`);
            const size = fs.statSync(file).size;
            if (size < 500 * 1024 || size > 8 * 1024 * 1024) throw new Error(`GLB outside R4 size budget: ${name} ${size}`);
            total += size;
            triangles += Number(a.triangles || 0);
          }
          console.log(`R4_GENERATED_ASSETS_PASS assets=6 sizeMiB=${(total/1024/1024).toFixed(2)} triangles=${triangles}`);
          NODE

      - name: Next.js Vercel-mode production build
        working-directory: /tmp/convalt-r4/src
        env:
          VERCEL: "1"
        run: npm run build

      - name: Package verified Vercel deployment source
        working-directory: /tmp/convalt-r4/src
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude=node_modules --exclude=.next -czf /tmp/convalt-r4/convalt-r4-vercel-source.tar.gz .
          sha256sum /tmp/convalt-r4/convalt-r4-vercel-source.tar.gz | tee /tmp/convalt-r4/convalt-r4-vercel-source.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: convalt-r4-vercel-source
          path: |
            /tmp/convalt-r4/convalt-r4-vercel-source.tar.gz
            /tmp/convalt-r4/convalt-r4-vercel-source.sha256
          if-no-files-found: error
          retention-days: 7
