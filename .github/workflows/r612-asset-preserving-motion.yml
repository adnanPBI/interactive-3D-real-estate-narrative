name: R6.1.2 asset-preserving motion

on:
  workflow_dispatch:
  push:
    branches:
      - feature/r612-asset-preserving-motion

jobs:
  validate-build-browser-package:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DEPLOYMENT_TIER: staging
      BUILD_ID: ${{ github.sha }}
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_ALLOW_INDEXING: 0
      NEXT_PUBLIC_3D_ASSET_SET: r6
      NEXT_PUBLIC_BRAND_ASSET_SET: stage4
      ENABLE_ACCEPTANCE_QA: 1
      CONTACT_WEBHOOK_URL: http://127.0.0.1:8787/contact
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove R6.1.2 binary assets are byte-identical to remediation baseline
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin r612-codex-remediation --depth=1
          git diff --exit-code origin/r612-codex-remediation -- \
            public/models/r6 \
            public/textures/r6 \
            public/fallback/r6
          echo "ASSET_IDENTITY=PASS"

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Clean dependency install
        run: npm ci --no-audit --no-fund

      - name: Asset-preserving motion contracts
        run: node --test tests/r612-asset-motion-contract.test.mjs

      - name: Existing R6.1.2 remediation contracts
        run: node --test tests/r6-runtime-contract.test.mjs tests/r612-remediation-contract.test.mjs tests/r612-rendering-contract.test.mjs

      - name: Semantic TypeScript
        run: npm run typecheck

      - name: Next production build
        run: npm run build

      - name: Install browser acceptance dependencies
        run: |
          pip install -r requirements-acceptance.txt
          playwright install --with-deps chromium

      - name: Start built app and local webhook sink
        shell: bash
        run: |
          set -euo pipefail
          node -e "require('http').createServer((req,res)=>{req.resume();req.on('end',()=>{res.writeHead(204);res.end()})}).listen(8787,'127.0.0.1')" > /tmp/webhook.log 2>&1 &
          npm start > /tmp/r612-motion-app.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/api/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/r612-motion-app.log
          exit 1

      - name: Six-chapter browser acceptance
        run: python3 scripts/acceptance_qa.py --url http://127.0.0.1:3000 --six-chapter-proof-only --out artifacts/r612-asset-motion-six-chapter

      - name: Package clean source archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/package
          git archive --format=zip --output=artifacts/package/Convalt_Energy_R6_1_2_Asset_Preserving_Motion.zip HEAD
          sha256sum artifacts/package/Convalt_Energy_R6_1_2_Asset_Preserving_Motion.zip | tee artifacts/package/Convalt_Energy_R6_1_2_Asset_Preserving_Motion.zip.sha256
          printf 'commit=%s\nasset_identity=PASS\nprocedural_motion=PASS\n' "$GITHUB_SHA" > artifacts/package/BUILD_EVIDENCE.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r612-asset-preserving-motion
          path: |
            artifacts/package
            artifacts/r612-asset-motion-six-chapter
            /tmp/r612-motion-app.log
          if-no-files-found: warn
